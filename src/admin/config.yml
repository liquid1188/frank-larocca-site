backend:
  name: github
  repo: liquid1188/frank-larocca-site
  branch: main
media_folder: src/images
public_folder: /images
collections:
  - name: events
    label: Performances
    label_singular: Performance
    description: "Press Add to announce a date. Past dates move to the past list on their own."
    folder: src/events
    create: true
    slug: "{{fields.date}}-{{slug}}-{{fields.city}}"
    summary: "{{date}} · {{title}} · {{city}}"
    sortable_fields: [date, title]
    view_groups:
      - label: Year
        field: date
        pattern: \d{4}
    fields:
      - { name: title, label: What is being performed, default: "Mass of the Americas", hint: "Change this if it is another work. For example: Miserere, Solemn Pontifical Mass" }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", default: "{{now}}" }
      - { name: time, label: Time (optional), required: false, hint: "For example: 11 am" }
      - { name: venue, label: Venue, hint: "For example: Cathedral of St. Mary of the Assumption" }
      - { name: city, label: City and state, hint: "For example: San Francisco, CA" }
      - { name: who, label: Celebrant, conductor, or ensemble (optional), required: false }
      - { name: url, label: Link for details (optional), required: false }
      - { name: tags, widget: hidden, default: event }
  - name: news
    label: News
    label_singular: Post
    description: "A short post or an announcement. The newest shows first on the home page."
    folder: src/news
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title }
      - { name: date, label: Date, widget: datetime, default: "{{now}}", time_format: false }
      - { name: layout, widget: hidden, default: base.njk }
      - { name: tags, widget: hidden, default: news }
      - { name: body, label: Post, widget: markdown }
  - name: works
    label: Works
    label_singular: Work
    description: "One entry per piece. Only the title and category are required; add links and a note whenever you have them."
    folder: src/works-md
    create: true
    slug: "{{slug}}"
    summary: "{{title}} · {{forces}}"
    sortable_fields: [title, year]
    fields:
      - { name: title, label: Title }
      - { name: categories, label: Category, widget: select, multiple: true, default: ["SATB a cappella"],
          options: ["Mass settings & large works", "SATB a cappella", "SSAA", "Choral–instrumental", "Propers & motets", "Chamber & orchestral"] }
      - { name: forces, label: Forces and duration, required: false, hint: "For example: SATB a cappella 4'" }
      - { name: year, label: Year, required: false }
      - { name: preview, label: Score preview link, required: false, hint: "Issuu or PDF" }
      - { name: audio, label: Recording link, required: false, hint: "YouTube, SoundCloud, or YouTube Music" }
      - { name: video, label: Video link, required: false, hint: "YouTube" }
      - { name: purchase, label: Where to buy the score, required: false }
      - { name: recording, label: Album page on this site, required: false, hint: "For example: /recordings/#mass-of-the-americas" }
      - { name: directors, label: Performance materials link, required: false }
      - { name: hero, label: Header photo, widget: image, required: false }
      - { name: heroCaption, label: Header photo caption, required: false }
      - { name: body, label: Program note, widget: markdown, required: false }
  - name: settings
    label: Everything else
    description: "Albums, videos, endorsements, press and affiliation logos, featured works, and site settings."
    files:
      - name: featured
        label: Featured works (home page)
        file: src/_data/featured.json
        fields:
          - { name: featured, label: Works on the home page, widget: list, hint: "Six works; the first three show as pictures.", field: { name: slug, label: Work, widget: relation, collection: works, search_fields: [title], value_field: "{{slug}}", display_fields: [title] } }
      - name: recordings
        label: Recordings
        file: src/_data/recordings.json
        fields:
          - name: recordings
            label: Albums
            widget: list
            fields:
              - { name: id, label: Short id, hint: "Lowercase, no spaces. Used for links to this album, for example mass-of-the-americas" }
              - { name: title, label: Title }
              - { name: label, label: Label and catalogue number, default: "Cappella Records" }
              - { name: year, label: Year, widget: number, default: 2026 }
              - { name: cover, label: Cover image, widget: image, required: false }
              - { name: blurb, label: Description, widget: text, hint: "Performers, what is on it, anything notable" }
              - { name: tracks, label: Track list, widget: text, required: false, hint: "Separate with a middle dot or a comma" }
              - { name: preview, label: YouTube preview video id, required: false }
              - name: links
                label: Links
                widget: object
                fields:
                  - { name: label, label: Label page, required: false }
                  - { name: spotify, label: Spotify, required: false }
                  - { name: apple, label: Apple Music, required: false }
                  - { name: amazon, label: Amazon, required: false }
                  - { name: youtube, label: YouTube Music, required: false }
                  - { name: notes, label: Liner notes link, required: false }
      - name: videos
        label: Videos (home page)
        file: src/_data/videos.json
        fields:
          - name: videos
            label: Videos
            widget: list
            fields:
              - { name: id, label: YouTube video id, hint: "The part after v= in the address, for example fdhVcmgygEU" }
              - { name: title, label: Title }
              - { name: source, label: Source or credit, default: "Benedict XVI Institute" }
              - { name: kind, label: Kind, widget: select, options: ["performance", "requiem", "talk", "preview"], default: "performance" }
              - { name: selected, label: Selected performance (top of Listen page), widget: boolean, required: false }
              - { name: featured, label: Featured on the home page, widget: boolean, required: false }
      - name: endorsements
        label: Endorsements
        file: src/_data/endorsements.json
        fields:
          - name: endorsements
            label: Quotes (first three show on the home page)
            widget: list
            fields:
              - { name: quote, label: Quote, widget: text, hint: "The words only; quotation marks are added for you" }
              - { name: name, label: Name }
              - { name: title, label: Title or publication }
              - { name: about, label: About which work, required: false, default: "Mass of the Americas" }
              - { name: url, label: Link to the source, required: false }
      - name: press
        label: Press strip
        file: src/_data/press.json
        fields:
          - name: press
            label: Publications
            widget: list
            fields:
              - { name: name, label: Publication }
              - { name: logo, label: Logo image, widget: image, required: false, hint: "PNG or SVG with a transparent background" }
              - { name: raw, label: Logo is a solid box (show it gray instead of white), widget: boolean, required: false, default: false }
              - { name: home, label: Show on the home page strip, widget: boolean, required: false, default: false }
      - name: affiliations
        label: Affiliations
        file: src/_data/affiliations.json
        fields:
          - name: affiliations
            label: Organisations
            widget: list
            fields:
              - { name: name, label: Full name }
              - { name: short, label: Short name, hint: "As it should read if no logo is uploaded" }
              - { name: role, label: Role, default: "Publisher", hint: "For example: Publisher, Faculty, Composer-in-Residence" }
              - { name: url, label: Link, required: false }
              - { name: logo, label: Logo image, widget: image, required: false }
              - { name: raw, label: Show logo in its own colours (no silhouette), widget: boolean, required: false }
              - { name: square, label: Square logo (show larger), widget: boolean, required: false }
              - { name: wide, label: Wide logo, widget: boolean, required: false }
      - name: writing
        label: Interviews & writing
        file: src/_data/writing.json
        fields:
          - name: writing
            label: Items
            widget: list
            fields:
              - { name: title, label: Title }
              - { name: outlet, label: Outlet, hint: "Publication, then the writer if you like: National Catholic Register, Joan Frawley Desmond" }
              - { name: year, label: Year, widget: number, default: 2026 }
              - { name: url, label: Link }
              - { name: kind, label: Kind, widget: select, options: ["Interview", "Profile", "Review", "Feature", "Podcast", "By Frank"], default: "Feature" }
      - name: site
        label: Site settings
        file: src/_data/site.json
        fields:
          - { name: url, label: Site URL }
          - { name: setupMode, label: Setup mode (hide from search engines), widget: boolean }
          - { name: contactEmail, label: Contact form delivers to }
          - { name: materialsEmail, label: Performance materials email }
          - { name: pressAddress, label: Press address }
          - { name: pressPhone, label: Press phone }
          - name: social
            label: Social links
            widget: object
            fields:
              - { name: youtube, label: YouTube }
              - { name: soundcloud, label: SoundCloud }
              - { name: facebook, label: Facebook }
              - { name: x, label: X }
              - { name: issuu, label: Issuu }
          - { name: youtubeUploads, label: YouTube uploads playlist id }
          - { name: institute, label: Benedict XVI Institute link }
          - { name: instituteComposerPage, label: Institute composer page }
          - { name: projectGuadalupe, label: Project Guadalupe link }
          - { name: instituteDonate, label: Support the Institute link }
