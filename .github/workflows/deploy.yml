name: Deploy to GitHub Pages
on:
  workflow_dispatch:   # manual until launch; switch to push:branches:[main] at launch
  schedule:
    - cron: "15 9 * * 1"   # every Monday, so performances move from Upcoming to Past on their own
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx @11ty/eleventy --pathprefix=/frank-larocca-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
